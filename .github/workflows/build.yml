name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Syntax check
        run: for file in src/*.js src/*.cjs scripts/*.cjs test/*.cjs; do node --check "$file"; done
      - run: npm test

  # The installer takes a few minutes of Windows runner time, so it is built on
  # demand (Actions → Build → Run workflow) or for version tags such as v0.1.0.
  installer:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*-setup.exe
          if-no-files-found: error
