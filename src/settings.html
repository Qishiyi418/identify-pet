<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
  <title>桌宠设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="heading">
    <img src="../assets/icons/app.png" alt="拉拉队员头像" width="48" height="48">
    <div><p class="brand">拉拉队员桌宠</p><h1>桌宠设置</h1></div>
    <span id="save-status" role="status" aria-live="polite">正在读取</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="设置分类">
    <button id="tab-general" role="tab" aria-selected="true" aria-controls="general">常用设置</button>
    <button id="tab-random" role="tab" aria-selected="false" aria-controls="random" tabindex="-1">随机动作</button>
  </nav>
  <main>
    <section id="general" role="tabpanel" aria-labelledby="tab-general">
      <section class="size-section" aria-labelledby="size-title">
        <div class="section-heading"><h2 id="size-title">人物大小</h2><output id="height-value" for="height">—</output></div>
        <label class="sr-only" for="height">人物大小</label>
        <input id="height" type="range" min="160" max="420" step="1" disabled>
        <div class="range-ends"><span id="height-min">160</span><span id="height-max">420</span></div>
        <div class="size-foot"><p>拖动滑块，人物会实时缩放。</p><button id="reset-size" class="text-button">恢复默认</button></div>
      </section>
      <section class="behavior-section" aria-labelledby="behavior-title">
        <h2 id="behavior-title">日常行为</h2>
        <label class="toggle-row"><span><strong>随机播放动作</strong><small>待机一段时间后自己找点事做，分组持续 30 秒</small></span><input id="randomEnabled" class="switch" type="checkbox" disabled></label>
        <div class="toggle-row"><span><strong><label for="activityIdleSec">动作频率</label></strong><small>连续待机多久后开始下一个随机动作</small></span><select id="activityIdleSec" class="compact-select" disabled></select></div>
        <label class="toggle-row"><span><strong>按条件和权重选择动作</strong><small>关闭后恢复原来的等概率随机方式</small></span><input id="conditionalRandomEnabled" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>随机移动</strong><small>允许自动走动和撑伞升降</small></span><input id="wanderEnabled" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>只在原位附近活动</strong><small>走动和撑伞不离开你放置的位置太远</small></span><input id="roamNearHome" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>悬停打招呼</strong><small>鼠标在人物上停留片刻时挥手并显示问候</small></span><input id="hoverGreetingEnabled" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>保持置顶</strong><small>让人物显示在其他窗口上方</small></span><input id="alwaysOnTop" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>全屏时自动避让</strong><small>同一屏幕进入全屏时隐藏并暂停</small></span><input id="avoidFullscreen" class="switch" type="checkbox" disabled></label>
        <label class="toggle-row"><span><strong>开机自动启动</strong><small>登录 Windows 后自动出现在桌面上</small></span><input id="launchAtLogin" class="switch" type="checkbox" disabled></label>
      </section>
      <aside class="interaction-note"><strong>和她互动</strong><p>点击摸头或回应，长按提起、松手放下。<br>右键人物或单击托盘图标打开菜单，双击托盘图标显示/隐藏。</p></aside>
    </section>
    <section id="random" role="tabpanel" aria-labelledby="tab-random" hidden>
      <div class="random-intro"><h2>让动作更合时宜</h2><p>“优先”会提高合适时段的出现概率，“仅”会限制出现时段。再结合冷却与权重抽选；权重 0 即关闭。手动点播不受限制。</p></div>
      <p id="random-disabled" class="notice" hidden>随机播放已关闭，可在“常用设置”中开启。</p>
      <p id="conditions-disabled" class="notice" hidden>当前使用原来的等概率随机，以下规则暂不生效。可在“常用设置”中开启条件选择。</p>
      <div id="action-rules"></div>
      <button id="reset-random" class="text-button reset-random">恢复默认随机规则</button>
    </section>
  </main>
  <footer><span>修改会自动保存</span><span>按 Esc 关闭此窗口，桌宠继续陪伴</span></footer>
  <script src="settings.js"></script>
</body>
</html>
